<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Halftone still life of a bowl of eggs">
  <defs>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="2.6" fill="#0f0f0f"/>
    </pattern>
    <pattern id="dotsFine" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#0f0f0f"/>
    </pattern>
    <radialGradient id="shade" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="62%" stop-color="#dcdcd6"/>
      <stop offset="100%" stop-color="#8e8e86"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="#e9e7df"/>
  <rect width="1200" height="900" fill="url(#dots)" opacity="0.10"/>
  <g>
    <ellipse cx="600" cy="620" rx="330" ry="60" fill="#000" opacity="0.16"/>
    <ellipse cx="470" cy="470" rx="150" ry="190" fill="url(#shade)"/>
    <ellipse cx="720" cy="500" rx="160" ry="200" fill="url(#shade)"/>
    <ellipse cx="600" cy="380" rx="140" ry="175" fill="url(#shade)"/>
    <ellipse cx="600" cy="380" rx="140" ry="175" fill="url(#dotsFine)" opacity="0.10"/>
    <ellipse cx="600" cy="380" rx="120" ry="150" fill="url(#glow)"/>
    <ellipse cx="470" cy="470" rx="130" ry="165" fill="url(#glow)" opacity="0.8"/>
    <ellipse cx="720" cy="500" rx="135" ry="170" fill="url(#glow)" opacity="0.7"/>
  </g>
  <rect x="70" y="70" width="1060" height="760" fill="none" stroke="#0f0f0f" stroke-width="2"/>
  <text x="100" y="160" font-family="Helvetica, Arial, sans-serif" font-size="120" font-weight="800" fill="#0f0f0f" letter-spacing="-4">FRESH</text>
  <text x="100" y="270" font-family="Helvetica, Arial, sans-serif" font-size="120" font-weight="800" fill="none" stroke="#0f0f0f" stroke-width="2" letter-spacing="-4">EGGS</text>
</svg>